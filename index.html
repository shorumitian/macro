<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Food Log"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Food Log V4</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#dbeafe 0,transparent 32%),radial-gradient(circle at 95% 10%,#dcfce7 0,transparent 30%),linear-gradient(160deg,#f8fafc,#eef2ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{max-width:620px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:28px;margin:3px 0}.muted{color:#64748b;font-weight:700}.card{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 16px 40px #64748b22}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border-radius:20px;padding:16px;color:#fff;box-shadow:0 12px 25px #64748b25;position:relative;overflow:hidden}.metric:after{content:'';position:absolute;width:72px;height:72px;border-radius:50%;background:#ffffff20;right:-20px;top:-24px}.metric:nth-child(1){background:linear-gradient(135deg,#111827,#334155)}.metric:nth-child(2){background:linear-gradient(135deg,#2563eb,#60a5fa)}.metric:nth-child(3){background:linear-gradient(135deg,#d97706,#fbbf24)}.metric:nth-child(4){background:linear-gradient(135deg,#059669,#34d399)}.metric b{display:block;font-size:26px;position:relative;z-index:1}.metric span{font-size:12px;color:#ffffffd9;font-weight:800;position:relative;z-index:1}button{border:0;border-radius:16px;background:#0f172a;color:#fff;font-weight:800;padding:12px 14px;font-size:14px}.secondary{background:#eef2f7;color:#0f172a}.danger{background:#fff1f2;color:#be123c}.tabs{display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap;background:#eef2f7;color:#334155}.tab.active{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 7px 16px #05966935}.search,input{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:13px;font-size:16px;background:#fbfdff}.search{margin:12px 0}.foodlist{display:grid;gap:9px}.foodbtn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:linear-gradient(135deg,#f8fafc,#f0fdf4);color:#0f172a;border:1px solid #dcebe0;box-shadow:0 5px 14px #64748b12}.foodname{font-weight:900}.foodmacro{font-size:11px;color:#64748b;margin-top:3px}.plus{font-size:22px;color:#059669}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#64748b;font-weight:800;margin:8px 0 5px}.readonly{background:#eef7f0;color:#047857;font-weight:900}.bar{height:9px;background:#e7edf0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#059669}.target{display:flex;justify-content:space-between;color:#64748b;font-size:12px;font-weight:800;margin-bottom:8px}.logrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #f1f5f9}.logname{font-weight:900}.logmacro{font-size:12px;color:#64748b}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;color:#64748b;padding:18px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 15px;border-radius:99px;opacity:0}.toast.show{opacity:1}dialog{border:0;border-radius:22px;width:min(92%,480px)}
</style></head><body><main class="app"><div class="top"><div><div class="muted" id="date"></div><h1>My Food Log</h1></div><button class="secondary" onclick="openTargets()">Targets</button></div><section class="summary"><div class="metric"><b id="cal">0</b><span>Calories</span></div><div class="metric"><b id="protein">0g</b><span>Protein</span></div><div class="metric"><b id="carbs">0g</b><span>Carbs</span></div><div class="metric"><b id="fat">0g</b><span>Fat</span></div></section><section class="card"><div class="target"><span id="progress">0 / 120g protein</span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="bar"></div></div></section><section class="card"><div class="top"><h2>Today's log</h2><span class="muted" id="count"></span></div><div id="log"></div></section><section class="card"><div class="top"><h2>Choose food</h2><span class="muted" id="menuCount"></span></div><input class="search" id="search" placeholder="Search foods"><div class="tabs"><button class="tab active" data-cat="Favorites">★ Favorites</button><button class="tab" data-cat="All">All</button><button class="tab" data-cat="Breakfast">Breakfast</button><button class="tab" data-cat="Snacks">Snacks</button><button class="tab" data-cat="Lunch/Dinner">Lunch/Dinner</button></div><div id="menu" class="foodlist"></div></section><section class="card"><h2>Add custom food</h2><div class="formgrid"><div class="full"><label>Food name</label><input id="name"></div><div><label>Carbs (g)</label><input id="c" type="number" inputmode="decimal"></div><div><label>Protein (g)</label><input id="p" type="number" inputmode="decimal"></div><div><label>Fat (g)</label><input id="f" type="number" inputmode="decimal"></div><div><label>Calculated calories</label><input id="k" class="readonly" readonly value="0"></div><button class="full" onclick="addCustom()">Add food</button></div></section><section class="toolbar"><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="danger" onclick="clearToday()">Clear today</button></section></main><dialog id="targets"><h2>Daily targets</h2><label>Calories</label><input id="targetCal" type="number"><label>Protein (g)</label><input id="targetProtein" type="number"><div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="targets.close()">Cancel</button><button onclick="saveTargets()">Save</button></div></dialog><div id="toast" class="toast"></div><script>
const M=[
['Breakfast','55g raw Oatmeal',28,6,3,163],['Breakfast','Almond 10gm',1,3,5,61],['Breakfast','Milk 200ml',9,6,6.2,115.8],['Breakfast','Sugar',16,0,0,64],['Breakfast','Brown bread',20,4,.5,100.5],['Breakfast','2 egg + 1 white',0,16,10,154],['Breakfast','2 egg',0,13,10,142],['Breakfast','Cheese',.4,2.9,2.1,32.1],['Breakfast','Pancake 60gm',34,15,2.5,218.5],['Breakfast','Poha 2 cups cooked',50,10,10,330],['Breakfast','Avocado 0.5',5,1.5,11,125],['Breakfast','Egg/cheese/bread',20.4,22.9,12.6,286.6],
['Snacks','Cereal 40gm + Milk',25,5,2,138],['Snacks','Protein powder',4,30,2.5,158.5],['Snacks','Protein bar',18,21,6,210],['Snacks','Protein bar 0.5',9,10,3,103],['Snacks','Yogurt',10,15,0,100],['Snacks','Fruit',18,0,0,72],['Snacks','Popcorn',8,1,7,99],['Snacks','Maggi',43,6,13,313],['Snacks','Cheerios 50gm',38,4,2.5,190.5],['Snacks','Makhana 40gm',30,4,0,136],['Snacks','Aussie bite 0.5',7,1,3.5,63.5],['Snacks','Roasted chana 30gm',20,6,2,122],['Snacks','Three farmer snack mix',16,11,2,126],
['Lunch/Dinner','Chicken bowl',46,30,10,394],['Lunch/Dinner','Paneer 80gm',2.4,14.4,17.6,225.6],['Lunch/Dinner','Oil 5gm',0,0,4,36],['Lunch/Dinner','Daal 80gm raw',50,17,1,277],['Lunch/Dinner','Quinoa garlic 120gm',40,4.5,3,205],['Lunch/Dinner','Boca patty',7,14,1,93],['Lunch/Dinner','Tofu 150gm',4.3,13.6,6.3,128.3],['Lunch/Dinner','Rice 50gm raw',38,5,0,172],['Lunch/Dinner','Feta cheese',1,5,5,69],['Lunch/Dinner','Original griller patty',8,16,5,141],['Lunch/Dinner','Kidney beans 220g',35,12,0,188],['Lunch/Dinner','Chicken breast 5oz 140gm',15,27,11,267],['Lunch/Dinner','Chicken breast 3oz 84gm',9,16,7,163],['Lunch/Dinner','Sabudana khichdi 1.5 pl',88,6,12,484],['Lunch/Dinner','Fulka roti 1',15,3,3.5,103.5],['Lunch/Dinner','Protein tortilla -1',15,7,3,115],['Lunch/Dinner','Protein tortilla -1.5',22.5,10.5,4.5,172.5],['Lunch/Dinner','Papad',6,2,0,32]];
const F=new Set(['Protein powder','Protein bar 0.5','Protein bar','Yogurt','Fruit','Milk 200ml','Tofu 150gm','Sugar','Almond 10gm']);const q=id=>document.getElementById(id),n=v=>Number(v)||0,fmt=v=>Number(n(v).toFixed(1)).toLocaleString(),day=()=>new Date().toLocaleDateString('en-CA'),key=()=>`food-v3-${day()}`;let items=JSON.parse(localStorage.getItem(key())||'[]'),prefs=JSON.parse(localStorage.getItem('food-v3-targets')||'{"cal":1800,"protein":120}'),cat='Favorites';
function init(){q('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});q('search').oninput=menu;['c','p','f'].forEach(x=>q(x).oninput=calc);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));menu()});menu();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js')}
function menu(){const s=q('search').value.toLowerCase(),a=M.filter(x=>(cat==='All'||x[0]===cat||(cat==='Favorites'&&F.has(x[1])))&&x[1].toLowerCase().includes(s));q('menuCount').textContent=a.length+' foods';q('menu').innerHTML=a.map(x=>`<button class="foodbtn" onclick="add(${M.indexOf(x)})"><span><span class="foodname">${x[1]}</span><div class="foodmacro">C ${fmt(x[2])} · P ${fmt(x[3])} · F ${fmt(x[4])} · ${fmt(x[5])} cal</div></span><span class="plus">＋</span></button>`).join('')}
function add(i){const x=M[i];items.push({cat:x[0],name:x[1],c:x[2],p:x[3],f:x[4],k:x[5],time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});save();toast(x[1]+' added')}function calc(){q('k').value=fmt(n(q('c').value)*4+n(q('p').value)*4+n(q('f').value)*9)}function addCustom(){const name=q('name').value.trim();if(!name)return q('name').focus();const c=n(q('c').value),p=n(q('p').value),f=n(q('f').value),k=c*4+p*4+f*9;items.push({cat:'Custom',name,c,p,f,k,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});['name','c','p','f'].forEach(x=>q(x).value='');q('k').value='0';save();toast(name+' added')}function save(){localStorage.setItem(key(),JSON.stringify(items));render()}function del(i){items.splice(i,1);save()}
function render(){const t=items.reduce((a,x)=>({c:a.c+n(x.c),p:a.p+n(x.p),f:a.f+n(x.f),k:a.k+n(x.k)}),{c:0,p:0,f:0,k:0});q('cal').textContent=fmt(t.k);q('protein').textContent=fmt(t.p)+'g';q('carbs').textContent=fmt(t.c)+'g';q('fat').textContent=fmt(t.f)+'g';q('count').textContent=items.length+' items';const pc=Math.min(100,Math.round(t.p/prefs.protein*100));q('progress').textContent=`${fmt(t.p)} / ${prefs.protein}g protein`;q('pct').textContent=pc+'%';q('bar').style.width=pc+'%';q('log').innerHTML=items.length?items.map((x,i)=>`<div class="logrow"><div><div class="logname">${x.name}</div><div class="logmacro">${x.time} · ${x.cat}<br>C ${fmt(x.c)} · P ${fmt(x.p)} · F ${fmt(x.f)} · ${fmt(x.k)} cal</div></div><button class="danger" onclick="del(${i})">×</button></div>`).join(''):'<div class="empty">No foods logged yet.</div>'}function toast(s){q('toast').textContent=s;q('toast').classList.add('show');setTimeout(()=>q('toast').classList.remove('show'),900)}function clearToday(){if(confirm('Clear today?')){items=[];save()}}function openTargets(){q('targetCal').value=prefs.cal;q('targetProtein').value=prefs.protein;targets.showModal()}function saveTargets(){prefs={cal:n(q('targetCal').value)||1800,protein:n(q('targetProtein').value)||120};localStorage.setItem('food-v3-targets',JSON.stringify(prefs));targets.close();render()}function exportCSV(){const a=document.createElement('a'),rows=['Time,Category,Food,Carbs,Protein,Fat,Calories',...items.map(x=>[x.time,x.cat,x.name,x.c,x.p,x.f,x.k].map(v=>'"'+v+'"').join(','))];a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download=`food-${day()}.csv`;a.click()}init();
</script></body></html>
