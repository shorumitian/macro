<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Food Log"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Food Log</title><style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#059669;--bg:#f4f8f5;--amber:#f59e0b;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#effaf2,#eef4ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{max-width:620px;margin:auto;min-height:100vh;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:28px;margin:4px 0}.date,.muted{color:var(--muted);font-weight:700}.card{background:#fff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #64748b20}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border-radius:18px;padding:15px;background:#f8fafc}.metric b{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted);font-weight:700}.cal{background:#0f172a;color:#fff}.cal span{color:#cbd5e1}h2{font-size:18px;margin:0 0 12px}button{border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;padding:12px 14px;font-size:14px;touch-action:manipulation}.secondary{background:#eef2f7;color:var(--ink)}.danger{background:#fff1f2;color:#be123c}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;background:#eef2f7;color:#334155}.tab.active{background:var(--green);color:#fff}.search{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-size:16px;background:#fbfdff;margin:12px 0}.foodlist{display:grid;gap:9px}.foodbtn{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:#f7faf8;color:var(--ink);border:1px solid #e7efe9;padding:11px}.foodbtn .emoji{font-size:24px;text-align:center}.foodname{font-size:14px;font-weight:900}.foodmacro{font-size:11px;color:var(--muted);margin-top:3px}.plus{font-size:22px;color:var(--green)}label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:9px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px;background:#fbfdff}.wide{width:100%}.logrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #f1f5f9}.food{font-weight:850}.macros{font-size:12px;color:var(--muted);margin-top:3px}.iconbtn{padding:8px 10px;border-radius:12px}.bar{height:9px;background:#e7edf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--green)}.target{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:750}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.note{text-align:center;font-size:12px;color:var(--muted);padding:10px}.empty{text-align:center;color:var(--muted);padding:20px}dialog{border:0;border-radius:24px;width:min(92%,500px);padding:18px}dialog::backdrop{background:#0f172a88}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 16px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.count{font-size:12px;color:var(--muted);font-weight:800}.sectionlabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin:14px 0 8px}
</style></head><body><main class="app"><div class="top"><div><div class="date" id="date"></div><h1>My Food Log</h1></div><button class="secondary" onclick="openTargets()">Targets</button></div><section class="summary"><div class="metric cal"><b id="cal">0</b><span>Calories</span></div><div class="metric"><b id="protein">0g</b><span>Protein</span></div><div class="metric"><b id="carbs">0g</b><span>Carbs</span></div><div class="metric"><b id="fat">0g</b><span>Fat</span></div></section><section class="card"><h2>Protein progress</h2><div class="target"><span id="proteinProgress">0 / 120g</span><span id="proteinPct">0%</span></div><div class="bar"><div class="fill" id="proteinBar"></div></div></section><section class="card"><div class="top"><h2>Choose from your menu</h2><span class="count" id="menuCount"></span></div><input class="search" id="search" placeholder="Search foods, e.g., protein or chicken"><div class="tabs"><button class="tab active" data-cat="All">All</button><button class="tab" data-cat="Breakfast">Breakfast</button><button class="tab" data-cat="Snacks">Snacks</button><button class="tab" data-cat="Lunch/Dinner">Lunch/Dinner</button></div><div id="menu" class="foodlist"></div></section><section class="card"><h2>Add custom food</h2><div class="formgrid"><div class="full"><label>Food name</label><input id="name" placeholder="Custom item"></div><div><label>Carbs (g)</label><input id="c" type="number" inputmode="decimal"></div><div><label>Protein (g)</label><input id="p" type="number" inputmode="decimal"></div><div><label>Fat (g)</label><input id="f" type="number" inputmode="decimal"></div><div><label>Calories</label><input id="k" type="number" inputmode="decimal"></div><button class="wide full" onclick="addCustom()">Add food</button></div></section><section class="card"><div class="top"><h2>Today's log</h2><span class="date" id="count"></span></div><div id="log"></div></section><section class="toolbar"><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="danger" onclick="clearToday()">Clear today</button></section><div class="note">Install from Safari: Share → Add to Home Screen. Entries stay on this device.</div></main><dialog id="targets"><h2>Daily targets</h2><label>Calories</label><input id="targetCal" type="number" inputmode="numeric"><label>Protein (g)</label><input id="targetProtein" type="number" inputmode="numeric"><div class="toolbar" style="margin-top:14px"><button class="secondary" onclick="document.getElementById('targets').close()">Cancel</button><button onclick="saveTargets()">Save</button></div></dialog><div class="toast" id="toast"></div><script>
const MENU=[
{cat:'Breakfast',icon:'🥣',name:'55g raw Oatmeal',c:28,p:6,f:3,k:163},{cat:'Breakfast',icon:'🌰',name:'Almond 10gm',c:1,p:3,f:5,k:61},{cat:'Breakfast',icon:'🥛',name:'Milk 200ml',c:9,p:6,f:6.2,k:115.8},{cat:'Breakfast',icon:'🍬',name:'Sugar',c:16,p:0,f:0,k:64},{cat:'Breakfast',icon:'🍞',name:'Brown bread',c:20,p:4,f:.5,k:100.5},{cat:'Breakfast',icon:'🍳',name:'2 egg + 1 white',c:0,p:16,f:10,k:154},{cat:'Breakfast',icon:'🍳',name:'2 egg',c:0,p:13,f:10,k:142},{cat:'Breakfast',icon:'🧀',name:'Cheese',c:.4,p:2.9,f:2.1,k:32.1},{cat:'Breakfast',icon:'🥞',name:'Pancake 60gm',c:34,p:15,f:2.5,k:218.5},{cat:'Breakfast',icon:'🍚',name:'Poha 2 cups cooked',c:50,p:10,f:10,k:330},{cat:'Breakfast',icon:'🥑',name:'Avocado 0.5',c:5,p:1.5,f:11,k:125},{cat:'Breakfast',icon:'🥪',name:'Egg/cheese/bread',c:20.4,p:22.9,f:12.6,k:286.6},
{cat:'Snacks',icon:'🥣',name:'Cereal 40gm + Milk',c:25,p:5,f:2,k:138},{cat:'Snacks',icon:'🥤',name:'Protein powder',c:4,p:30,f:2.5,k:158.5},{cat:'Snacks',icon:'🍫',name:'Protein bar',c:18,p:21,f:6,k:210},{cat:'Snacks',icon:'🥣',name:'Yogurt',c:10,p:15,f:0,k:100},{cat:'Snacks',icon:'🍎',name:'Fruit',c:18,p:0,f:0,k:72},{cat:'Snacks',icon:'🍿',name:'Popcorn',c:8,p:1,f:7,k:99},{cat:'Snacks',icon:'🍜',name:'Maggi',c:43,p:6,f:13,k:313},{cat:'Snacks',icon:'🥣',name:'Cheerios 50gm',c:38,p:4,f:2.5,k:190.5},{cat:'Snacks',icon:'⚪',name:'Makhana 40gm',c:30,p:4,f:0,k:136},{cat:'Snacks',icon:'🧁',name:'Aussie bite 0.5',c:7,p:1,f:3.5,k:63.5},{cat:'Snacks',icon:'🫘',name:'Roasted chana 30gm',c:20,p:6,f:2,k:122},{cat:'Snacks',icon:'🥜',name:'Three farmer snack mix',c:16,p:11,f:2,k:126},
{cat:'Lunch/Dinner',icon:'🍗',name:'Chicken bowl',c:46,p:30,f:10,k:394},{cat:'Lunch/Dinner',icon:'🧀',name:'Paneer 80gm',c:2.4,p:14.4,f:17.6,k:225.6},{cat:'Lunch/Dinner',icon:'🫗',name:'Oil 5gm',c:0,p:0,f:4,k:36},{cat:'Lunch/Dinner',icon:'🥣',name:'Daal 80gm raw',c:50,p:17,f:1,k:277},{cat:'Lunch/Dinner',icon:'🍚',name:'Quinoa garlic 120gm',c:40,p:4.5,f:3,k:205},{cat:'Lunch/Dinner',icon:'🍔',name:'Boca patty',c:7,p:14,f:1,k:93},{cat:'Lunch/Dinner',icon:'🌱',name:'Tofu 150gm',c:4.3,p:13.6,f:6.3,k:128.3},{cat:'Lunch/Dinner',icon:'🍚',name:'Rice 50gm raw',c:38,p:5,f:0,k:172},{cat:'Lunch/Dinner',icon:'🧀',name:'Feta cheese',c:1,p:5,f:5,k:69},{cat:'Lunch/Dinner',icon:'🍔',name:'Original griller patty',c:8,p:16,f:5,k:141},{cat:'Lunch/Dinner',icon:'🫘',name:'Kidney beans 220g',c:35,p:12,f:0,k:188},{cat:'Lunch/Dinner',icon:'🍗',name:'Chicken breast 5oz 140gm',c:15,p:27,f:11,k:267},{cat:'Lunch/Dinner',icon:'🍗',name:'Chicken breast 3oz 84gm',c:9,p:16,f:7,k:163},{cat:'Lunch/Dinner',icon:'🍲',name:'Sabudana khichdi 1.5 pl',c:88,p:6,f:12,k:484},{cat:'Lunch/Dinner',icon:'🫓',name:'Fulka roti 1',c:15,p:3,f:3.5,k:103.5},{cat:'Lunch/Dinner',icon:'🌯',name:'Protein tortilla -1',c:15,p:7,f:3,k:115},{cat:'Lunch/Dinner',icon:'🌯',name:'Protein tortilla -1.5',c:22.5,p:10.5,f:4.5,k:172.5},{cat:'Lunch/Dinner',icon:'🫓',name:'Papad',c:6,p:2,f:0,k:32}
];
const q=id=>document.getElementById(id),n=v=>Number(v)||0,fmt=v=>Number(n(v).toFixed(1)).toLocaleString(),dayKey=()=>new Date().toLocaleDateString('en-CA'),logKey=()=>`food-pwa-v2-${dayKey()}`;let items=JSON.parse(localStorage.getItem(logKey())||'[]'),prefs=JSON.parse(localStorage.getItem('food-pwa-v2-targets')||'{"cal":1800,"protein":120}'),category='All';
function init(){q('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});q('search').addEventListener('input',renderMenu);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderMenu()}));renderMenu();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
function renderMenu(){const s=q('search').value.trim().toLowerCase(),list=MENU.filter(x=>(category==='All'||x.cat===category)&&(!s||x.name.toLowerCase().includes(s)));q('menuCount').textContent=list.length+' foods';q('menu').innerHTML=list.length?list.map(x=>`<button class="foodbtn" onclick="addMenu(${MENU.indexOf(x)})"><span class="emoji">${x.icon}</span><span><span class="foodname">${esc(x.name)}</span><span class="foodmacro">C ${fmt(x.c)} · P ${fmt(x.p)} · F ${fmt(x.f)} · ${fmt(x.k)} cal</span></span><span class="plus">＋</span></button>`).join(''):'<div class="empty">No matching foods.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){q('toast').textContent=s;q('toast').classList.add('show');setTimeout(()=>q('toast').classList.remove('show'),1000)}
function addMenu(i){const x=MENU[i];items.push({name:x.name,c:x.c,p:x.p,f:x.f,k:x.k,cat:x.cat,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});save();toast(x.name+' added')}
function addCustom(){const name=q('name').value.trim();if(!name){q('name').focus();return}items.push({name,c:n(q('c').value),p:n(q('p').value),f:n(q('f').value),k:n(q('k').value),cat:'Custom',time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});['name','c','p','f','k'].forEach(id=>q(id).value='');save();toast(name+' added')}
function save(){localStorage.setItem(logKey(),JSON.stringify(items));render()}function removeItem(i){items.splice(i,1);save()}
function render(){const t=items.reduce((a,x)=>({c:a.c+n(x.c),p:a.p+n(x.p),f:a.f+n(x.f),k:a.k+n(x.k)}),{c:0,p:0,f:0,k:0});q('cal').textContent=fmt(t.k);q('protein').textContent=fmt(t.p)+'g';q('carbs').textContent=fmt(t.c)+'g';q('fat').textContent=fmt(t.f)+'g';q('count').textContent=items.length+' items';const pct=Math.min(100,Math.round(t.p/(prefs.protein||120)*100));q('proteinProgress').textContent=`${fmt(t.p)} / ${prefs.protein}g`;q('proteinPct').textContent=pct+'%';q('proteinBar').style.width=pct+'%';q('log').innerHTML=items.length?items.map((x,i)=>`<div class="logrow"><div><div class="food">${esc(x.name)}</div><div class="macros">${x.time||''} · ${x.cat||''}<br>C ${fmt(x.c)} · P ${fmt(x.p)} · F ${fmt(x.f)} · ${fmt(x.k)} kcal</div></div><button class="danger iconbtn" onclick="removeItem(${i})">×</button></div>`).join(''):'<div class="empty">No foods logged yet.</div>'}
function clearToday(){if(confirm("Clear today's food log?")){items=[];save()}}function openTargets(){q('targetCal').value=prefs.cal;q('targetProtein').value=prefs.protein;q('targets').showModal()}function saveTargets(){prefs={cal:n(q('targetCal').value)||1800,protein:n(q('targetProtein').value)||120};localStorage.setItem('food-pwa-v2-targets',JSON.stringify(prefs));q('targets').close();render()}
function exportCSV(){const lines=['Time,Category,Food,Carbs,Protein,Fat,Calories',...items.map(x=>[x.time,x.cat,x.name,x.c,x.p,x.f,x.k].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download=`food-log-${dayKey()}.csv`;a.click()}init();
</script></body></html>
